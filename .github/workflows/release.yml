name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test the tagged source
        shell: bash
        run: |
          test "$(node -p 'require("./manifest.json").version')" = "$GITHUB_REF_NAME"
          npm ci
          npm test
          npm run build

      - name: Attest the release assets
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Verify provenance and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        shell: bash
        run: |
          assets=(main.js manifest.json styles.css)
          for asset in "${assets[@]}"; do
            gh attestation verify "$asset" --bundle "$ATTESTATION_BUNDLE" \
              --repo "$GITHUB_REPOSITORY" --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "suToDoku $GITHUB_REF_NAME" --generate-notes
